version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: parking-zone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: parkingzone123
      MYSQL_DATABASE: parking_zone_db
      MYSQL_USER: parkingzone
      MYSQL_PASSWORD: parkingzone123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - parking-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking-zone-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: parking_zone_db
      DB_USER: parkingzone
      DB_PASSWORD: parkingzone123
      JWT_SECRET: your_super_secret_jwt_key_here_change_in_production
      JWT_EXPIRES_IN: 24h
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - parking-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking-zone-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - parking-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: parking-zone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - parking-network

volumes:
  mysql_data:
  redis_data:

networks:
  parking-network:
    driver: bridge
